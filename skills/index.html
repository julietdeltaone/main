<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JD Meyers: Skills</title>
<meta name="description" content="Skills profile for JD Meyers, backed by real work.">
<meta name="theme-color" content="#07060a">
<style>
:root{
  --bg:#07060a; --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.20);
  --text:#f6f1ea; --muted:#b3a99c; --dim:#7d7468;
  --a1:#ff8a3d; --a2:#ffc470;
  --pad:clamp(16px,3vw,48px);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font:16px/1.55 "Inter",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}

body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(34vw 34vw at 50% 6%,rgba(255,196,112,.30),transparent 62%),
    radial-gradient(40vw 40vw at 92% 78%,rgba(255,110,30,.28),transparent 62%),
    radial-gradient(38vw 38vw at 4% 58%,rgba(24,92,110,.32),transparent 62%),
    radial-gradient(30vw 30vw at 20% 100%,rgba(255,138,61,.14),transparent 62%),
    var(--bg);
  filter:blur(30px)}

.glass{border:1px solid var(--line);border-radius:22px;background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(1.35);backdrop-filter:blur(24px) saturate(1.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 50px -28px rgba(0,0,0,.8)}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  padding:12px var(--pad);background:rgba(10,8,8,.42);
  -webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);
  border-bottom:1px solid var(--line)}
.id{display:flex;align-items:baseline;gap:14px;min-width:0}
.mark{font-weight:800;letter-spacing:-.02em;font-size:1.2rem;white-space:nowrap}
.mark i{font-style:normal;background:linear-gradient(90deg,var(--a2),var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--muted);font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.views{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--glass);color:var(--muted);padding:7px 14px;border-radius:999px;
  font:inherit;font-size:.85rem;text-decoration:none;white-space:nowrap;transition:all .25s var(--ease)}
.chip:hover{color:var(--text);border-color:var(--a1)}
.chip[aria-current="true"]{color:#07060a;background:linear-gradient(90deg,var(--a2),var(--a1));border-color:transparent;font-weight:600}

/* layout */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:var(--pad);padding:var(--pad);align-items:start}
.side{position:sticky;top:84px;padding:22px;display:grid;gap:20px;max-height:calc(100vh - 104px);overflow:auto}
.side h2{margin:0 0 8px;font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;color:var(--a2);font-weight:600}
.side p{margin:0;color:var(--muted);font-size:.93rem}
.nav{display:grid;gap:4px}
.nav a{display:flex;justify-content:space-between;gap:10px;align-items:center;text-decoration:none;color:var(--muted);
  padding:9px 12px;border-radius:12px;font-size:.93rem;border:1px solid transparent;transition:all .25s var(--ease)}
.nav a span{color:var(--dim);font-size:.8rem}
.nav a:hover{color:var(--text);background:var(--glass)}
.nav a.on{color:var(--text);background:var(--glass2);border-color:var(--line2)}
.stamp{color:var(--dim);font-size:.8rem}

/* body */
.cat{scroll-margin-top:84px;margin-bottom:clamp(28px,5vh,52px)}
.cat h2{margin:0;font-size:clamp(1.4rem,2.4vw,2rem);font-weight:700;letter-spacing:-.03em}
.cat .sub{margin:4px 0 18px;color:var(--muted)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));align-items:start}
.skill{padding:22px 24px}
.skill h3{margin:0;font-size:1.15rem;font-weight:650;letter-spacing:-.02em;line-height:1.25}
.desc{margin:6px 0 0;color:var(--muted);font-size:.95rem}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;color:var(--dim);font-size:.8rem}
.ev{margin-top:14px;display:grid;gap:10px}
.ev-item{padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
.ev-item h4{margin:0 0 2px;font-size:.84rem;font-weight:600;color:var(--a2)}
.ev-item p{margin:0;color:var(--muted);font-size:.9rem}
.ev-item a{display:inline-block;margin-top:6px;color:var(--text);font-size:.82rem;text-decoration:none;border-bottom:1px solid var(--a1);word-break:break-all}

#err{padding:40px var(--pad);color:#ff9b9b}
footer{padding:20px var(--pad) 32px;color:var(--dim);font-size:.82rem;border-top:1px solid var(--line)}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  .tag{display:none}
  .nav{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto}
}
@media print{
  :root{color-scheme:light}
  body{background:#fff;color:#000;font-size:10pt}
  body::before{display:none}
  .top .views,.nav,.side .stamp{display:none}
  .top{position:static;background:none;border:0;padding:0 0 6pt;backdrop-filter:none;-webkit-backdrop-filter:none}
  .mark i{background:none;color:#000;-webkit-text-fill-color:#000}
  .tag{color:#222}
  .layout{display:block;padding:0}
  .glass{background:#fff;border:1px solid #bbb;border-radius:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  .side{position:static;max-height:none;padding:6pt 8pt;margin-bottom:8pt}
  .side p,.desc,.ev-item p,.meta{color:#333}
  .side h2,.ev-item h4{color:#000}
  .grid{display:block}
  .skill{padding:6pt 8pt;margin-bottom:5pt;break-inside:avoid}
  .ev-item{background:none;border-color:#ddd;padding:3pt 6pt}
  .ev-item a{border:0;color:#000}
  .cat h2{font-size:12pt}
  .cat .sub{color:#333;margin-bottom:6pt}
  footer{border-color:#999;color:#333}
}
</style>
</head>
<body>
<header class="top">
  <div class="id">
    <div class="mark" id="mark"><i>JD</i> Meyers</div>
    <div class="tag" id="headline"></div>
  </div>
  <div class="spacer"></div>
  <nav class="views" id="views" aria-label="Views"></nav>
  <a class="chip" href="#" onclick="window.print();return false">Print</a>
</header>

<div class="layout">
  <aside class="side glass">
    <section>
      <h2>About</h2>
      <p id="summary"></p>
    </section>
    <section>
      <h2>What I do</h2>
      <nav class="nav" id="nav" aria-label="Areas"></nav>
    </section>
    <div class="stamp" id="stamp"></div>
  </aside>
  <main id="list"></main>
</div>
<p id="err" hidden>Could not load skills.json.</p>
<footer id="foot"></footer>

<script>
(function(){
  var qs = new URLSearchParams(location.search);
  var current = qs.get("view") || "all";

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text != null) e.textContent = text;
    return e;
  }

  fetch("skills.json", {cache:"no-cache"}).then(function(r){
    if(!r.ok) throw new Error("load");
    return r.json();
  }).then(render).catch(function(){
    document.getElementById("err").hidden = false;
  });

  function render(data){
    if(!data.views[current]) current = "all";
    document.title = data.name + ": Skills";
    var parts = data.name.split(" ");
    var mark = document.getElementById("mark");
    mark.textContent = "";
    mark.appendChild(el("i", null, parts[0]));
    mark.appendChild(document.createTextNode(" " + parts.slice(1).join(" ")));

    document.getElementById("headline").textContent = data.headline;
    document.getElementById("summary").textContent = data.summary;
    document.getElementById("stamp").textContent = "Last updated " + data.updated;
    document.getElementById("foot").textContent = data.name;

    var views = document.getElementById("views");
    Object.keys(data.views).forEach(function(key){
      var a = el("a", "chip", data.views[key].label);
      a.href = key === "all" ? "?" : "?view=" + key;
      if(key === current) a.setAttribute("aria-current", "true");
      views.appendChild(a);
    });

    var tags = data.views[current].tags;
    var shown = data.skills.filter(function(s){
      if(s.tier !== "public") return false;
      return !tags.length || s.audiences.some(function(t){ return tags.indexOf(t) > -1; });
    });
    var cats = data.categories.filter(function(c){
      return shown.some(function(s){ return s.category === c; });
    });

    var blurbs = data.category_blurbs || {};
    var nav = document.getElementById("nav");
    var list = document.getElementById("list");

    cats.forEach(function(cat, ci){
      var items = shown.filter(function(s){ return s.category === cat; });
      var b = blurbs[cat] || {title: cat, sub: ""};
      var id = "area-" + ci;

      var a = el("a", null, b.title.replace(/\.$/, ""));
      a.href = "#" + id;
      a.dataset.target = id;
      a.appendChild(el("span", null, String(items.length)));
      nav.appendChild(a);

      var sec = el("section", "cat");
      sec.id = id;
      sec.appendChild(el("h2", null, b.title));
      if(b.sub) sec.appendChild(el("p", "sub", b.sub));
      var grid = el("div", "grid");
      items.forEach(function(s){ grid.appendChild(card(s)); });
      sec.appendChild(grid);
      list.appendChild(sec);
    });

    if("IntersectionObserver" in window){
      var links = nav.querySelectorAll("a");
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if(en.isIntersecting){
            links.forEach(function(l){ l.classList.toggle("on", l.dataset.target === en.target.id); });
          }
        });
      }, {rootMargin:"-20% 0px -65% 0px"});
      list.querySelectorAll(".cat").forEach(function(s){ io.observe(s); });
    }
  }

  function card(s){
    var c = el("article", "skill glass");
    c.appendChild(el("h3", null, s.name));
    c.appendChild(el("p", "desc", s.summary));

    var meta = el("div", "meta");
    if(s.first_seen) meta.appendChild(el("span", null, "Since " + s.first_seen));
    if(s.last_seen) meta.appendChild(el("span", null, "Last used " + s.last_seen));
    if(meta.childNodes.length) c.appendChild(meta);

    var ev = el("div", "ev");
    s.evidence.forEach(function(e){
      var item = el("div", "ev-item");
      item.appendChild(el("h4", null, e.title));
      item.appendChild(el("p", null, e.note));
      if(e.link){
        var a = el("a", null, e.link.replace(/^https?:\/\//, "").replace(/\/$/, ""));
        a.href = e.link; a.rel = "noopener";
        item.appendChild(a);
      }
      ev.appendChild(item);
    });
    c.appendChild(ev);
    return c;
  }
})();
</script>
</body>
</html>
